name: Hourly Harrity Ops Check

on:
  workflow_dispatch:
  schedule:
    # Safe hourly status check. This workflow does not call paid AI APIs.
    - cron: "7 * * * *"

permissions:
  contents: read

jobs:
  hourly-ops:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate persistent state
        run: python scripts/validate_state.py

      - name: Run credential guard
        run: python scripts/credential_guard.py

      - name: Validate Nurse Prep web app
        run: python scripts/validate_nurse_prep_web.py

      - name: Generate daily workset
        run: python scripts/create_daily_workset.py --out-dir daily_worksets

      - name: Run hourly ops status
        run: python scripts/run_hourly_ops.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Upload hourly ops artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harrity-hourly-ops
          path: |
            daily_worksets/
            manifests/hourly_ops_status.json
            manifests/credential_guard_report.json
            logs/
