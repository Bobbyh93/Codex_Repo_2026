name: Live Launch Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  launch-check:
    name: NurseStudy launch readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment source
        run: npm run manifest:live-launch-source

      - name: Scan for deploy-blocking secrets
        run: npm run scan:live-launch-secrets

      - name: Build production app
        run: npm run build

      - name: Run launch surface typecheck
        run: npm run check:launch

      # check:launch only fails on diagnostics inside a hardcoded 23-path
      # "launch surface" allowlist; everything else it counts and lets pass.
      # That is how 337 type errors accumulated outside the allowlist, taking
      # a batch of genuinely broken features with them. The legacy count is
      # now 0, so the full project typecheck is enforced here to keep it there.
      - name: Typecheck full project
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Start local launch preview
        shell: bash
        run: |
          PORT=5055 npm run preview:lesson-builder > /tmp/nursestudy-preview.log 2>&1 &
          echo $! > /tmp/nursestudy-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5055/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nursestudy-preview.log
          exit 1

      - name: Run launch surface smoke
        run: npm run smoke:launch-surfaces

      - name: Run live launch preflight
        run: npm run preflight:live-launch
