name: Neon Preview Branch

# Creates a disposable Neon database branch for each pull request and deletes
# it when the PR closes. Nothing here touches the production database: every
# step is scoped to the per-PR preview branch, whose connection string comes
# from the create-branch step's output.
#
# Two deliberate deviations from the snippet in Neon's setup UI:
#
# 1. No `tj-actions/branch-names` action, and no `setup` job at all. The branch
#    name is used only to build a unique Neon branch name, and the PR number
#    alone is already unique and stable. Dropping it removes a third-party
#    action from the CI supply chain (the tj-actions org was compromised in
#    March 2025 via CVE-2025-30066, where tags were repointed at malicious
#    code) and avoids having to sanitize branch names containing "/", which
#    this repo uses.
# 2. The migration step is enabled rather than left commented out, adapted to
#    this repo's actual script name (`db:push`; there is no `db:migrate`).

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Least privilege: contents:read is needed only to check out the repo so the
# schema-validation step can run. Nothing here writes to the PR.
permissions:
  contents: read

jobs:
  create_neon_branch:
    name: Create Neon Branch
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get branch expiration date (14 days from now)
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # Applies the Drizzle schema to the PREVIEW branch only -- a disposable
      # copy -- proving db:push is safe before anyone runs it on production.
      #
      # The action's db_url_with_pooler points at the branch's DEFAULT database,
      # which on this project is `neondb`. This app's data lives in `nursestudy`
      # (the branch carries neondb, nursestudy and postgres). Postgres extensions
      # are per-database, and only `nursestudy` has pgvector -- so pushing at
      # `neondb` failed with `type "vector" does not exist`, because
      # shared/schema.ts declares document_chunks.embedding as a vector column.
      # The database segment of the URL is therefore rewritten below.
      #
      # The URL is never echoed: it carries credentials.
      #
      # Deliberately no `--force`: it auto-approves data-loss statements. The
      # three columns this branch adds are additive and nullable and apply
      # without it. Verified directly against the production schema that push
      # has nothing else to do: table sets match exactly (no DROP/CREATE TABLE)
      # and the only column deltas are those three ADD COLUMNs.
      #
      # `< /dev/null` keeps it non-interactive so an unexpected prompt exits on
      # EOF instead of hanging.
      - name: Apply schema to preview branch
        timeout-minutes: 5
        env:
          BRANCH_URL: ${{ steps.create_neon_branch.outputs.db_url_with_pooler }}
        run: |
          set -euo pipefail
          base="${BRANCH_URL%%\?*}"
          query="${BRANCH_URL#"$base"}"
          root="${base%/*}"
          export DATABASE_URL="$root/nursestudy$query"
          echo "Targeting database: nursestudy (URL withheld)"
          npm run db:push < /dev/null

  delete_neon_branch:
    name: Delete Neon Branch
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      # Deletes only the disposable preview branch created above, matched by
      # the same deterministic name. Production branches are never targeted.
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
