name: Daily Harrity Workset

on:
  workflow_dispatch:
  schedule:
    # 9:00 AM Pacific during daylight saving time. Adjust if strict wall-clock
    # scheduling is needed outside PDT.
    - cron: "0 16 * * *"

permissions:
  contents: read

jobs:
  daily-workset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate persistent state
        run: python scripts/validate_state.py

      - name: Run credential guard
        run: python scripts/credential_guard.py

      - name: Validate Nurse Prep web app
        run: python scripts/validate_nurse_prep_web.py

      - name: Generate daily workset
        run: python scripts/create_daily_workset.py --out-dir daily_worksets

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Upload generated workset
        uses: actions/upload-artifact@v4
        with:
          name: harrity-daily-workset
          path: daily_worksets/
